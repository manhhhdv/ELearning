# Cấu hình Nginx chạy trực tiếp trên host (không phải trong Docker) cho domain hoctap.space.
# Phục vụ frontend tĩnh (frontend/dist) + reverse proxy /api/* sang backend Go đang chạy
# trong Docker và bind ở 127.0.0.1:8082 (xem docker-compose.prod.yml). Xem DEPLOY.md mục 3C/4C.
#
# Cài đặt:
#   sudo cp deploy/nginx-hoctap.space.conf /etc/nginx/sites-available/hoctap.space
#   sudo ln -s /etc/nginx/sites-available/hoctap.space /etc/nginx/sites-enabled/hoctap.space
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sau đó xin TLS bằng certbot (tự sửa file này thêm listen 443 + đường dẫn chứng chỉ):
#   sudo certbot --nginx -d hoctap.space -d www.hoctap.space

server {
    listen 80;
    listen [::]:80;
    server_name hoctap.space www.hoctap.space;

    root /var/www/hoctap.space/dist;
    index index.html;

    access_log /var/log/nginx/hoctap.space.access.log;
    error_log  /var/log/nginx/hoctap.space.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy API sang backend Go (container Docker bind ở 127.0.0.1:8082).
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets build ra tên file có hash (vite) — cache dài hạn.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: mọi route con của React Router trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

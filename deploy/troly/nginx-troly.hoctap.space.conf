# Nginx (cài trên host) cho troly.hoctap.space: phục vụ frontend tĩnh + proxy /api/* sang backend
# trong Docker (127.0.0.1:8093, xem deploy/troly/docker-compose.yml).
#
# Cài đặt (một lần, trên server):
#   sudo cp nginx-troly.hoctap.space.conf /etc/nginx/sites-available/troly.hoctap.space
#   sudo ln -s /etc/nginx/sites-available/troly.hoctap.space /etc/nginx/sites-enabled/troly.hoctap.space
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d troly.hoctap.space

server {
    listen 80;
    listen [::]:80;
    server_name troly.hoctap.space;

    root /workspace/thviet/2026/troly-hoctap-space/frontend/dist;
    index index.html;

    access_log /var/log/nginx/troly.hoctap.space.access.log;
    error_log  /var/log/nginx/troly.hoctap.space.error.log;

    # Cho phép tải tệp đính kèm/bài nộp cỡ vừa.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Các tác vụ AI (soạn bài, sinh câu hỏi) có thể chạy lâu, kể cả trả về dạng stream.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
